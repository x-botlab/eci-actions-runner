# eci-runner configuration.
#
# Secrets are not stored here: the App private key is mounted from a secret and
# the Alibaba Cloud credential comes from the instance RAM role.

github:
  # The App's OAuth client ID, the value GitHub recommends as the JWT issuer.
  client_id: Iv1.0123456789abcdef
  private_key_path: /etc/eci-runner/app.pem
  # One installation per account the App is installed on. Every repo carries the
  # installation that must mint its runner tokens.
  installations:
    - id: 10000000
      repos:
        # pools is optional; leaving it out gives the repo every pool, so a repo
        # never silently misses a pool that already exists.
        - owner: x-botlab
          name: eci-actions-runner
          pools: [pool-short, pool-heavy]
        - owner: x-botlab
          name: another-service
          pools: [pool-short]
    - id: 10000001
      repos:
        - owner: x-botlab-org2
          name: service-b
          pools: [pool-short]

eci:
  # Credentials for private images. The values themselves live in the
  # environment, so this file can be committed.
  registries:
    - server: registry.cn-hangzhou.aliyuncs.com
      username_env: ECI_ACR_USERNAME
      password_env: ECI_ACR_PASSWORD
  # One target per region. A pool is placed into exactly one target, so the same
  # label can serve two regions only through two pools.
  targets:
    - name: hangzhou
      region_id: cn-hangzhou
      endpoint: eci.cn-hangzhou.aliyuncs.com
      # More than one switch spreads launches across zones, which matters when a
      # single zone runs out of stock.
      vswitch_ids:
        - vsw-xxxxxxxxxxxxxxxxx
        - vsw-yyyyyyyyyyyyyyyyy
      security_group_id: sg-xxxxxxxxxxxxxxxxx
      ram_role_name: eci-runner-self-delete
      # A runner needs egress to reach GitHub. Without a NAT gateway in the VPC,
      # each container group gets its own public IP instead.
      # Measured: eip_bandwidth 20 pulls a 2.5 GB image cross-region in ~16s.
      auto_create_eip: true
      eip_bandwidth: 20
    - name: beijing
      region_id: cn-beijing
      endpoint: eci.cn-beijing.aliyuncs.com
      vswitch_ids:
        - vsw-zzzzzzzzzzzzzzzzz
      security_group_id: sg-yyyyyyyyyyyyyyyyy
      ram_role_name: eci-runner-self-delete
      auto_create_eip: true
      eip_bandwidth: 20

runner:
  work_folder: _work
  poll_interval_seconds: 30
  max_concurrent_launches: 5
  pending_timeout_seconds: 180

pools:
  # Time sensitive jobs: pre-warmed so the ~60s container start is hidden.
  - name: pool-short
    # Ordered: beijing is the fallback when hangzhou is out of stock.
    eci: [hangzhou, beijing]
    # A container registry endpoint is regional, so each target pulls from its own
    # ACR instance. Image names without an override fall back to `image` below.
    images:
      hangzhou: registry.cn-hangzhou.aliyuncs.com/xbotlab/actions-runner:2.338.2
    image: registry.cn-hangzhou.aliyuncs.com/xbotlab/actions-runner:2.338.2
    vcpu: 4
    memory_gib: 8
    min: 0
    warm: 1
    max: 6
    labels:
      - eci-pool-short
    ttl_minutes: 380
    spot: false

  # Docker builds and long jobs: created on demand, never pre-warmed, because a
  # 60s start is noise next to a 30 minute build.
  - name: pool-heavy
    eci: beijing
    vcpu: 8
    memory_gib: 16
    min: 0
    warm: 0
    max: 4
    labels:
      - eci-pool-heavy
    # Mirror this tag into the beijing ACR instance before enabling the pool.
    image: registry.cn-beijing.aliyuncs.com/xbotlab/actions-runner:2.338.2
    ttl_minutes: 400
    spot: false
