; Started by entrypoint.sh only when the container was created privileged, which
; is the only case where the image runs a docker daemon.
;
; dockerd goes through sudo because the container runs as the unprivileged runner
; user and the daemon needs root; its socket is created with --group=runner so
; job steps can use it without sudo. The runner program stops supervisord when it
; exits, so the container does not outlive the job.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
; /run belongs to root and supervisord runs as the runner user.
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dockerd]
command=/usr/bin/sudo --non-interactive /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --group=runner
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:runner]
command=/usr/local/bin/eci-run.sh
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
