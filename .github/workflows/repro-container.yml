name: repro-container

# Temporary: reproduces the `container:` job path on a single job so the failure
# can be read from one runner's log. Deleted once the bug is fixed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: [self-hosted, eci-pool-docker]
    timeout-minutes: 15
    container:
      image: node:22-bookworm
    steps:
      - name: Identity
        run: |
          echo "container: $(hostname)"
          echo "user: $(id -un) $(id -u):$(id -g)"
          node --version
