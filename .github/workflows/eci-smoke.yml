name: eci-smoke

# Manual trigger only. This repository is public, and a self-hosted runner must
# never pick up work from an untrusted source: a fork pull request would otherwise
# execute its own code inside the container.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, eci-pool-small]
    timeout-minutes: 15
    steps:
      - name: Identity
        run: |
          echo "runner     : $RUNNER_NAME"
          echo "os         : $(uname -srm)"
          echo "user       : $(id -un) ($(id -u):$(id -g))"
          echo "started at : $(date -u +%FT%TZ)"

      - uses: actions/checkout@v4

      - name: Workspace
        run: |
          pwd
          ls -la
          git log --oneline -1

      - name: Toolchain
        run: |
          node --version
          npm --version
          go version
          python3 --version
          docker --version
          docker buildx version
          git --version

      - name: Egress
        run: |
          # 401 is a success here: the registry is private, so an unauthenticated
          # probe must be refused. The point is reachability, not authorisation.
          check() {
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$1" || echo 000)
            printf '%-46s %s\n' "$1" "$code"
            case "$code" in
              200|301|302|401|403) ;;
              *) echo "unreachable: $1" >&2; return 1 ;;
            esac
          }
          check https://github.com
          check https://api.github.com
          check https://registry.cn-hangzhou.aliyuncs.com/v2/

      - name: Secrets are not visible to the job
        run: |
          if [ -n "${ACTIONS_RUNNER_INPUT_JITCONFIG:-}" ]; then
            echo "FAIL: the JIT registration credential is visible to the job"
            exit 1
          fi
          echo "ok: ACTIONS_RUNNER_INPUT_JITCONFIG is not set"
