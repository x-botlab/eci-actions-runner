name: eci-smoke

# Manual trigger only. This repository is public, and a self-hosted runner must
# never pick up work from an untrusted source: a fork pull request would otherwise
# execute its own code inside the container.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, eci-pool-small]
    timeout-minutes: 15
    steps:
      - name: Identity
        run: |
          echo "runner     : $RUNNER_NAME"
          echo "os         : $(uname -srm)"
          echo "user       : $(id -un) ($(id -u):$(id -g))"
          echo "started at : $(date -u +%FT%TZ)"

      - uses: actions/checkout@v4

      - name: Workspace
        run: |
          pwd
          ls -la
          git log --oneline -1

      - name: Toolchain
        run: |
          node --version
          npm --version
          go version
          python3 --version
          docker --version
          docker buildx version
          git --version

      - name: Egress
        run: |
          # 401 is a success here: the registry is private, so an unauthenticated
          # probe must be refused. The point is reachability, not authorisation.
          check() {
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$1" || echo 000)
            printf '%-46s %s\n' "$1" "$code"
            case "$code" in
              200|301|302|401|403) ;;
              *) echo "unreachable: $1" >&2; return 1 ;;
            esac
          }
          check https://github.com
          check https://api.github.com
          check https://registry.cn-hangzhou.aliyuncs.com/v2/

      - name: Secrets are not visible to the job
        run: |
          if [ -n "${ACTIONS_RUNNER_INPUT_JITCONFIG:-}" ]; then
            echo "FAIL: the JIT registration credential is visible to the job"
            exit 1
          fi
          echo "ok: ACTIONS_RUNNER_INPUT_JITCONFIG is not set"

  container:
    # The "bring your own toolchain" path: the pool keeps one runner image and the
    # workflow names the image its steps need, so a job does not reinstall PHP,
    # browsers or an SDK on every run. A job container needs a docker daemon, so
    # this only works on a privileged pool.
    #
    # The image needs git (checkout runs inside it) and a shell; the runner injects
    # its own node for JS actions, so node is not a requirement.
    runs-on: [self-hosted, eci-pool-docker]
    timeout-minutes: 15
    container:
      image: node:22-bookworm
    steps:
      - name: Identity
        run: |
          echo "container  : $(hostname)"
          echo "user       : $(id -un) ($(id -u):$(id -g))"
          echo "node       : $(node --version)"
          echo "git        : $(git --version)"

      - uses: actions/checkout@v4

      - name: The workspace is shared with the job container
        run: |
          pwd
          test -f go.mod && echo "ok: the checkout is visible inside the container"
          # The checkout is made by the runner user and this image runs as root, so
          # git refuses the workspace as "dubious ownership". A CI image should bake
          # `git config --system --add safe.directory '*'` in; this job does it here.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git log --oneline -1

      - name: The runner's toolchain is not in the image
        run: |
          if command -v go >/dev/null 2>&1; then
            echo "go is present: $(go version)"
          else
            echo "ok: go is absent, this job chose its own image"
          fi

  services:
    # A job with services needs the daemon before its first step, so this is the
    # case that decides whether the pre-job hook can ever warm the image store: the
    # hook has to run before "Initialize containers".
    runs-on: [self-hosted, eci-pool-docker]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smoke
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: The service is reachable on the runner's loopback
        run: |
          for _ in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/5433) 2>/dev/null; then
              echo "ok: postgres answers on 127.0.0.1:5433"
              exit 0
            fi
            sleep 1
          done
          echo "postgres never answered on 127.0.0.1:5433" >&2
          exit 1

      - name: Hook context
        run: |
          echo "workflow : $GITHUB_WORKFLOW"
          echo "job      : $GITHUB_JOB"
          docker version --format 'daemon {{.Server.Version}}'
          docker images --format '{{.Repository}}:{{.Tag}}' | head -5
